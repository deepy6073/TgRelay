spoke-unreachable: "服务器 %s 无法连接：%s"
hub-unreachable: "中心节点 %s 无法连接，消息已丢弃：%s"
no-relay-token: "relay.token 为空 — 中心节点与从节点必须使用同一个密钥，网桥已禁用"
no-hub-url: "relay.hub 为空 — 从节点必须知道中心节点地址，网桥已禁用"
restart-required: "server.name、relay.* 或 bot.token 已更改 — 需要重启服务器"
status-mode: "TgRelay：模式 %s，服务器 '%s'，网桥 %s"
status-spokes: "%s，从节点 %d 个"
moderation-test-sent-hub: "TgRelay：测试屏蔽消息已通过中心节点发送"
echoed: "游戏内无人 — 已回复到原会话，消息将暂存到有人进入 -> %s"
chats-skipped: "已跳过 %d 个会话：机器人被屏蔽或会话已删除（disabled-chats.txt）"
disabled-status: "已停用会话：%d 个 — 机器人被屏蔽或会话已删除（disabled-chats.txt）"
