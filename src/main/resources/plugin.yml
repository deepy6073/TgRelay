name: TgRelay
version: 1.4.0
main: world.losos.tgrelay.TgRelay
api-version: '1.21'
authors: [Losos World]
description: Minecraft chat to Telegram relay with long polling, a bounded queue and several servers on one bot.
website: https://github.com/deepy6073/TgRelay
commands:
  tgrelay:
    description: Relay a Minecraft chat to Telegram; players can mute themselves
    usage: "/tgrelay off|on|link|unlink|status — admin: reload|testmute"
permissions:
  tgrelay.admin:
    description: Allows /tgrelay reload, testmute and the global status
    default: op
