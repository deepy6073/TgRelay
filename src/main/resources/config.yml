# TgRelay — Minecraft chat <-> Telegram bot.

# Interface language: en, ru, zh. Bundled in the jar, can be overridden by
# dropping plugins/TgRelay/lang/<code>.yml next to this file.
language: en

server:
  # Name of THIS server. Put %server% into a format (see below) and every line
  # carries it, so one Telegram chat can serve several servers at once.
  # Example: name "Build" + from-minecraft "[%server%] %player%: %message%"
  # gives "[Build] Alex: hello". Empty means "no name, no prefix".
  name: ""
  # Optional marker instead of a name: %server_emoji% in the formats. One emoji
  # per server reads faster than a word and needs no translation, e.g. a fish
  # for the survival world and a brick for the creative one.
  emoji: ""

# Several servers, one bot.
#
# Telegram lets a bot have exactly ONE getUpdates reader, so two servers polling the
# same token steal each other's messages. That is what these modes are for:
#
#   standalone — own bot, polls Telegram itself (default, one server, nothing to do)
#   hub        — owns the bot: posts its own chat, accepts lines from spokes and
#                sends every Telegram message back to them
#   spoke      — no bot of its own: sends its chat to the hub, prints what the hub
#                sends back. bot.token and bot.chats are not used here.
#
# A spoke needs: relay.mode: spoke, the same relay.token as the hub, relay.hub pointing
# at the hub and its own relay.bind. The hub lists its spokes in relay.spokes.
relay:
  mode: standalone
  # Shared secret, at least a dozen random characters. Both sides must match.
  token: ""
  # Where the listener binds. Keep it on loopback unless the servers are on different
  # machines — then it has to be reachable from the hub (and the secret is not optional).
  bind: "127.0.0.1:8765"
  # Hub only: every server that reports to this hub.
  spokes:
    - "http://127.0.0.1:8766"
  # Spoke only: where the hub listens.
  hub: "http://127.0.0.1:8765"

# Badge plates: a word drawn as a picture and cut into 100x100 tiles, one custom emoji
# per tile. Write {name} anywhere in a format and it becomes the plate. Take the ids
# with getStickerSet and list the tiles in the order they were cut.
#
#   telegram:
#     badges:
#       losos:
#         fallback: "🐟"
#         tiles: ["5409250961279461863", "5409015811820005500", "5408879674241623000"]
#
# Bots may use custom emoji when the bot's owner has Telegram Premium; everyone can
# see them. Without the pack the text still works — the fallback emoji shows instead.
telegram:
  badges: {}
  # Player heads as the author's badge: the plugin downloads the skin head once per
  # player and adds it to the pack, then every chat line of that player starts with it.
  # The pack must exist and belong to the id in owner-id (a user, not a bot).
  avatars:
    enabled: false
    pack: ""
    owner-id: 0
    fallback: "🧑"

bot: posts its own chat, accepts lines from spokes and
#                sends every Telegram message back to them
#   spoke      — no bot of its own: sends its chat to the hub, prints what the hub
#                sends back. bot.token and bot.chats are not used here.
#
# A spoke needs: relay.mode: spoke, the same relay.token as the hub, relay.hub pointing
# at the hub and its own relay.bind. The hub lists its spokes in relay.spokes.
relay:
  mode: standalone
  # Shared secret, at least a dozen random characters. Both sides must match.
  token: ""
  # Where the listener binds. Keep it on loopback unless the servers are on different
  # machines — then it has to be reachable from the hub (and the secret is not optional).
  bind: "127.0.0.1:8765"
  # Hub only: every server that reports to this hub.
  spokes:
    - "http://127.0.0.1:8766"
  # Spoke only: where the hub listens.
  hub: "http://127.0.0.1:8765"

# Custom emoji badges: a normal emoji in the message text is replaced by a picture
# from a Telegram custom emoji pack. Take the ids with getStickerSet, put them here,
# and the bot swaps them in every message it sends. Bots may use custom emoji when
# the bot's owner has Telegram Premium; everyone can see them.
#
#   telegram:
#     emoji:
#       "🔁": "5406853940031563644"
#       "🔇": "5409225092691439135"
telegram:
  emoji: {}

bot:
  # Token from @BotFather.
  token: "PUT_BOT_TOKEN_HERE"
  # Where to post. Can be a private chat id (123456789), a group (-1001234567890)
  # or a public channel (@my_channel). Add one line per destination.
  chats: []
  # Where to accept messages from. Empty means "same as chats".
  # A group id (negative, -100...) works too: the sender is taken from the
  # message author, not from the chat, so group messages keep real names.
  listen: []

format:
  # Minecraft -> Telegram. %server% expands to server.name (empty name -> empty text),
  # %player% to the player, %message% to what they typed.
  from-minecraft: "%player%: %message%"
  # Telegram -> Minecraft (printed to the game via tellraw)
  to-minecraft: "[TG] %sender%: %message%"

events:
  chat: true
  join: true
  quit: true
  death: true
  advancement: true
  # Server messages: /say, announcements from other plugins, anything broadcast.
  broadcast: true

  broadcast-format: "[%server%] %message%"

  join-format: "%player% joined the game"
  quit-format: "%player% left the game"
  death-format: "%message%"
  advancement-format: "%player% has made the advancement %advancement%"

polling:
  # getUpdates long-poll timeout. 25-50 is fine: one connection stays open
  # instead of one per second. Do not set 0 — that is what turns a relay
  # into a polling hammer.
  timeout-seconds: 25

queue:
  # Telegram allows about 30 messages per second per bot; keep it low.
  messages-per-second: 3

# Self-mute: /tgrelay off keeps a player's messages out of the public chats.
# They are not lost: muted messages go to the moderation channel (see below)
# with the prefix from mute.prefix.
mute:
  # false — the command is refused, nobody can mute themselves.
  enabled: true
  # all  — mute chat and player events (join, quit, death, advancement)
  # chat — mute only chat, events still go to the public chats
  scope: all
  prefix: "[mute] "

# Where muted messages go. Two options, in order of priority:
#   1. moderation.chat is set  -> everything goes there (a separate Telegram chat
#      the players are not in). This is the simplest setup: add the bot to a chat,
#      put its id here, done — no account linking at all.
#   2. moderation.chat is empty -> a DM to every op (from ops.json) who linked
#      their Telegram account with /tgrelay link.
# Nobody linked and no chat set -> muted messages only reach the server console.
moderation:
  chat: ""

# Who may post from Telegram into the game.
linking:
  # true  — only accounts linked with /tgrelay link may post; everyone else gets
  #         a short instruction with the one-time code
  # false — any chat from bot.chats may post, named by its Telegram profile
  required: true

# Technical messages for admins (not for players): server started, server is
# stopping, Telegram unreachable for a while. They go to moderation.chat when it
# is set, otherwise to a DM of every linked operator, otherwise to the console.
notices:
  enabled: true
  prefix: "[TgRelay] "
  # How many failed Telegram polls in a row before the admins hear about it once.
  poll-failures: 5

delivery:
  # Every message from Telegram is always copied into bot.chats (except the chat
  # it came from), so someone who is not in game still sees everything in Telegram.
  # This setting only decides what to do with the in-game copy when nobody is online:
  #   skip — nothing waits: the feed already has the message (default)
  #   wait — keep it and print it when the first player joins
  when-empty: skip
  # How long a held message waits for the first player, and how many are kept.
  hold-max-minutes: 10
  hold-max-messages: 20
